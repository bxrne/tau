# Prometheus configuration for the Tau DB monitoring stack.

global:
  scrape_interval:     15s
  evaluation_interval: 15s
  scrape_timeout:      10s
  external_labels:
    cluster: "tau-prod"
    env:     "production"

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Tau DB metrics endpoint. The binary serves GET /metrics on --metrics-port (default 9100).
  - job_name: "tau"
    static_configs:
      - targets: ["tau:9100"]
        labels:
          instance: "tau-primary"
    metrics_path: /metrics
    scrape_interval: 10s
    scrape_timeout:  5s

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
