x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "5"
    compress: "true"

services:

  bench:
    build:
      context: ..
      dockerfile: container/Dockerfile.bench
      args:
        RUST_VERSION: "1.94.1"
        BUILD_PROFILE: "release"
    container_name: tau-bench
    logging: *default-logging

    volumes:
      - bench_results:/data

    tmpfs:
      - /tmp

    command:
      - "--preset"
      - "${TAU_BENCH_PRESET:-quick}"
      - "--scale"
      - "${TAU_BENCH_SCALE:-1000}"
      - "--seed"
      - "${TAU_BENCH_SEED:-42}"
      - "--format"
      - "json"
      - "--output"
      - "/data/results.json"

    read_only: true

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    deploy:
      resources:
        limits:
          cpus: "${TAU_BENCH_CPU_LIMIT:-1.0}"
          memory: "${TAU_BENCH_MEM_LIMIT:-512M}"
        reservations:
          cpus: "0.25"
          memory: "64M"

volumes:
  bench_results:
    driver: local
