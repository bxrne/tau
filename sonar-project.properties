sonar.projectKey=bxrne_tau
sonar.organization=theadambyrne

# Name and version shown in the SonarCloud UI.  Version is kept in sync with
# `Cargo.toml` by release-please when a release is cut.
sonar.projectName=tau
sonar.projectVersion=0.0.0

# Path is relative to this file. Sources live under crates/ (Cargo workspace);
# everything else is either generated, vendored, or sample data and should not
# be analysed.
sonar.sources=crates

# Source-code encoding.
sonar.sourceEncoding=UTF-8

# Coverage: the CI job runs `cargo llvm-cov nextest --cobertura` and SonarCloud
# ingests the Cobertura XML it emits. Keep the coverage.exclusions list below in
# sync with the --ignore-filename-regex passed to cargo-llvm-cov, or the number
# Sonar shows will diverge from the one measured locally.
sonar.coverageReportPaths=cobertura.xml

# Excluded from the coverage DENOMINATOR only (still analysed for bugs/smells):
# the DST harness (it is itself a test driver, no #[cfg(test)]), binary entry
# wiring, and pure re-export glue.
sonar.coverage.exclusions=\
    crates/dst/**,\
    crates/*/src/main.rs,\
    crates/**/mod.rs,\
    crates/libtau/src/lib.rs,\
    crates/libharness/src/lib.rs

# Things to keep out of the analysis: build artefacts, generated samples,
# container scaffolding, third-party assets, and the dashboard JSON which
# isn't really source code.
sonar.exclusions=\
    target/**,\
    examples/**,\
    container/**,\
    bench-samples/**,\
    **/*.json
