[package]
name = "tau"
version = "0.0.0" # x-release-please-version
edition = "2024"
license = "Apache-2.0"
description = "A time-series database built on algebraically precise temporal intervals."
publish = false

[[bin]]
name = "tau"
path = "src/bin/tau/main.rs"

[[bin]]
name = "dst"
path = "src/bin/dst/main.rs"

[[bin]]
name = "ctl"
path = "src/bin/tauctl/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crc32fast = "1.5.0"
rustc-hash = "2.1"
libc = "0.2"
nom = "8.0.0"
tracing = "0.1"
tracing-subscriber = "0.3"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
argon2 = "0.5"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2"
rcgen = "0.13"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
crossterm = "0.28"
tui-textarea = { version = "0.6", features = ["crossterm"] }

# Benchmarks
criterion = { version = "0.5", features = ["html_reports"] }

[dev-dependencies]
hegeltest = "0.14.12"
hegeltest-macros = "0.14.12"
pretty_assertions = "1.4"
tempfile = "3.27.0"

