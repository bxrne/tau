[workspace]
resolver = "2"
members = [
    "crates/libtau",
    "crates/libharness",
    "crates/tau",
    "crates/tauctl",
    "crates/dst",
]

[workspace.package]
version = "0.1.3"          # x-release-please-version
edition = "2024"
license = "Apache-2.0"
description = "A time-series database built on algebraically precise temporal intervals."
publish = false

[workspace.dependencies]
# Internal crates
libtau = { path = "crates/libtau" }
libharness = { path = "crates/libharness" }

# Third-party
clap = { version = "4.5", features = ["derive"] }
crc32fast = "1.5.0"
rustc-hash = "2.1"
nom = "8.0.0"
tracing = "0.1"
tracing-subscriber = "0.3"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
argon2 = "0.5"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2"
rcgen = "0.13"
rustyline = { version = "18.0", default-features = false, features = ["with-file-history"] }
ratatui = "0.29"
crossterm = "0.28"
tui-textarea = { version = "0.6", features = ["crossterm"] }

# Benchmarks
criterion = { version = "0.5", features = ["html_reports"] }

# Dev / test
hegeltest = "0.14.12"
hegeltest-macros = "0.14.12"
pretty_assertions = "1.4"
tempfile = "3.27.0"
