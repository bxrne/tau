[package]
name = "tau"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "tau"
path = "src/bin/tau/main.rs"

[[bin]]
name = "bench"
path = "src/bin/bench/main.rs"

[[bin]]
name = "ctl"
path = "src/bin/tauctl/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crc32fast = "1.5.0"
nom = "8.0.0"
tracing = "0.1"
tracing-subscriber = "0.3"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
argon2 = "0.5"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2"
rcgen = "0.13"

[dev-dependencies]
tempfile = "3.27.0"
