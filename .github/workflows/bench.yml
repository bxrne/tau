name: Bench

on:
  workflow_dispatch:

jobs:
  bench:
    name: Benchmark
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-C target-cpu=native -C codegen-units=1"
      MALLOC_CONF: "narenas:1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: bench
      - name: Build bench binary
        run: cargo build --profile release-bench --bin bench
      - name: Run benchmarks
        run: |
          ./target/release-bench/bench \
            --quick \
            --repeat 5 \
            --ops 1000 \
            --label "manual-${{ github.sha }}" \
            --out bench-results.csv \
            | tee bench-results.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bench-results-${{ github.sha }}
          path: |
            bench-results.csv
            bench-results.txt
          if-no-files-found: error
