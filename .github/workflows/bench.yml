name: DST

on:
  workflow_dispatch:

jobs:
  dst:
    name: Deterministic Simulation Tester
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: dst
      - name: Build dst binary
        run: cargo build --release --bin dst
      - name: Run full simulation
        run: |
          ./target/release/dst \
            --ops 1000 \
            --label "manual-${{ github.sha }}" \
            --out dst-results.csv \
            | tee dst-results.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dst-results-${{ github.sha }}
          path: |
            dst-results.csv
            dst-results.txt
          if-no-files-found: error
