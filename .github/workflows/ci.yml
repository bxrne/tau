name: CI

on:
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          cache-on-failure: "true"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          cache-on-failure: "true"
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: cargo nextest run --release

  dst:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          cache-on-failure: "true"
      - name: Install dstest
        run: cargo install --git https://github.com/bxrne/dstest --locked
      - name: Smoke test (Tau container, no faults)
        run: dstest < dst/smoke.lua

  fuzz:
    needs: test
    runs-on: ubuntu-latest
    env:
      FUZZ_TIME: 45 # seconds per target; bump on a scheduled (non-PR) run
      # Sanitizer-instrumented builds need a dynamically-linked glibc target;
      # the default host target can resolve to musl (static crt), which the
      # sanitizer rejects. Pin gnu for every cargo-fuzz invocation.
      FUZZ_TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          cache-on-failure: "true"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # Ensure each target's seed/corpus dir exists for a cold cargo-fuzz run.
      - name: Prepare corpus dirs
        run: mkdir -p crates/fuzztau/seeds/parse crates/fuzztau/seeds/wire
      # Build-check every target (covers the two we don't time-box below).
      - name: Build all fuzz targets
        run: cargo +nightly fuzz check --fuzz-dir crates/fuzztau --target $FUZZ_TARGET
      # Time-boxed runs on the highest-value targets, seeded from the committed
      # corpus + seeds and (for the text grammar) the TauQL dictionary. A crash
      # or OOM fails the job and the reproducer is uploaded as an artifact.
      - name: Fuzz parser
        run: cargo +nightly fuzz run --fuzz-dir crates/fuzztau --target $FUZZ_TARGET parse crates/fuzztau/seeds/parse -- -max_total_time=$FUZZ_TIME -dict=crates/fuzztau/tauql.dict -rss_limit_mb=2048
      - name: Fuzz wire decoder
        run: cargo +nightly fuzz run --fuzz-dir crates/fuzztau --target $FUZZ_TARGET wire crates/fuzztau/seeds/wire -- -max_total_time=$FUZZ_TIME -dict=crates/fuzztau/tauql.dict -rss_limit_mb=2048
      - name: Upload fuzz reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: crates/fuzztau/artifacts/
          if-no-files-found: ignore

