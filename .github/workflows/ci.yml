name: CI

on:
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          cache-on-failure: "true"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          cache-on-failure: "true"
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: cargo nextest run --release

  fuzz: 
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          cache-on-failure: "true"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - run: cargo +nightly fuzz check --fuzz-dir crates/fuzztau

  dst:
    name: DST (all libtau profiles + concurrent)
    needs: fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          cache-on-failure: "true"
      - run: cargo test -p libdst -p dst --release
      - name: DST smoke (--ci, seed 1)
        run: RUST_LOG=warn cargo run --release --bin dst -- --ci --seed 1
      - name: DST smoke (--ci, seed 2)
        run: RUST_LOG=warn cargo run --release --bin dst -- --ci --seed 2 --concurrency 0
      - name: DST standard tier
        run: RUST_LOG=warn cargo run --release --bin dst -- --ci --seed 1 --tier standard
      - name: DST nightly tier (wire/TLS/auth)
        run: RUST_LOG=warn cargo run --release --bin dst -- --ci --seed 1 --tier nightly --concurrency 0

  container:
    needs: dst
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: container/Dockerfile
          push: false
          tags: tau:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
