name: CI

on:
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          cache-on-failure: "true"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          cache-on-failure: "true"
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: cargo nextest run --release

  fuzz:
    needs: test
    runs-on: ubuntu-latest
    env:
      FUZZ_TIME: 45 # seconds per target; bump on a scheduled (non-PR) run
      # Sanitizer-instrumented builds need a dynamically-linked glibc target;
      # the default host target can resolve to musl (static crt), which the
      # sanitizer rejects. Pin gnu for every cargo-fuzz invocation.
      FUZZ_TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          cache-on-failure: "true"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # Ensure each target's seed/corpus dir exists; seeds/disk_decode is not
      # committed (the dir is gitignored), so create it for a cold cargo-fuzz run.
      - name: Prepare corpus dirs
        run: mkdir -p crates/fuzztau/seeds/parse crates/fuzztau/seeds/wire crates/fuzztau/seeds/disk_decode
      # Build-check every target (covers the two we don't time-box below).
      - name: Build all fuzz targets
        run: cargo +nightly fuzz check --fuzz-dir crates/fuzztau --target $FUZZ_TARGET
      # Time-boxed runs on the highest-value targets, seeded from the committed
      # corpus + seeds and (for the text grammar) the TauQL dictionary. A crash
      # or OOM fails the job and the reproducer is uploaded as an artifact.
      - name: Fuzz parser
        run: cargo +nightly fuzz run --fuzz-dir crates/fuzztau --target $FUZZ_TARGET parse crates/fuzztau/seeds/parse -- -max_total_time=$FUZZ_TIME -dict=crates/fuzztau/tauql.dict -rss_limit_mb=2048
      - name: Fuzz wire decoder
        run: cargo +nightly fuzz run --fuzz-dir crates/fuzztau --target $FUZZ_TARGET wire crates/fuzztau/seeds/wire -- -max_total_time=$FUZZ_TIME -dict=crates/fuzztau/tauql.dict -rss_limit_mb=2048
      - name: Fuzz binary disk decode
        run: cargo +nightly fuzz run --fuzz-dir crates/fuzztau --target $FUZZ_TARGET disk_decode crates/fuzztau/seeds/disk_decode -- -max_total_time=$FUZZ_TIME -rss_limit_mb=2048
      - name: Upload fuzz reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: crates/fuzztau/artifacts/
          if-no-files-found: ignore

  dst:
    name: DST (all libtau profiles + concurrent)
    needs: fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          cache-on-failure: "true"
      - run: cargo test -p libdst -p dst --release
      - name: DST smoke (--ci, seed 1)
        run: RUST_LOG=warn cargo run --release --bin dst -- --ci --seed 1
      - name: DST smoke (--ci, seed 2)
        run: RUST_LOG=warn cargo run --release --bin dst -- --ci --seed 2 --concurrency 0
      - name: DST standard tier
        run: RUST_LOG=warn cargo run --release --bin dst -- --ci --seed 1 --tier standard
      - name: DST nightly tier (wire/TLS/auth)
        run: RUST_LOG=warn cargo run --release --bin dst -- --ci --seed 1 --tier nightly --concurrency 0

  container:
    needs: dst
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: container/Dockerfile
          push: false
          tags: tau:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
