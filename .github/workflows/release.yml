name: Release

on:
  push:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      include_optional_tools:
        description: "Include additional artifacts"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: googleapis/release-please-action@v4
        with:
          release-type: simple
          draft: false

  build:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/${{ matrix.target }}/release/tau dist/tau-${{ matrix.target }}
          tar -czf tau-${{ matrix.target }}.tar.gz -C dist .
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tau-${{ matrix.target }}
          path: tau-${{ matrix.target }}.tar.gz

  upload-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tau-x86_64-unknown-linux-gnu/*.tar.gz
            tau-aarch64-unknown-linux-gnu/*.tar.gz
