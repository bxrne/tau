name: Release

on:
  push:
    branches: [master]
    tags:
      - 'tau-v*'
      - 'tauctl-v*'
      - 'libtau-v*'
      - 'libdst-v*'
      - 'dst-v*'

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  # ── On every push to master ─────────────────────────────────────────────────
  # Opens / updates one release PR per crate that has unreleased conventional
  # commits. Merging a release PR causes release-please to push a versioned tag
  # (tau-v*, tauctl-v*, libtau-v*) using RELEASE_TOKEN so the tag push
  # triggers this workflow a second time and the publish jobs below run.
  release-please:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_TOKEN }}

  # ── On every versioned tag push ──────────────────────────────────────────────
  # Detect which crate was released and emit outputs used by all downstream jobs.
  prepare:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    outputs:
      binary:     ${{ steps.detect.outputs.binary }}
      version:    ${{ steps.detect.outputs.version }}
      is_tau:     ${{ steps.detect.outputs.is_tau }}
      has_binary: ${{ steps.detect.outputs.has_binary }}
    steps:
      - id: detect
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == tau-v* ]]; then
            echo "binary=tau"               >> "$GITHUB_OUTPUT"
            echo "version=${TAG#tau-v}"     >> "$GITHUB_OUTPUT"
            echo "is_tau=true"             >> "$GITHUB_OUTPUT"
            echo "has_binary=true"         >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == tauctl-v* ]]; then
            echo "binary=tauctl"           >> "$GITHUB_OUTPUT"
            echo "version=${TAG#tauctl-v}" >> "$GITHUB_OUTPUT"
            echo "is_tau=false"            >> "$GITHUB_OUTPUT"
            echo "has_binary=true"         >> "$GITHUB_OUTPUT"
          else
            echo "binary="          >> "$GITHUB_OUTPUT"
            echo "version="         >> "$GITHUB_OUTPUT"
            echo "is_tau=false"     >> "$GITHUB_OUTPUT"
            echo "has_binary=false" >> "$GITHUB_OUTPUT"
          fi

  # Cross-compile for Linux x86_64, Linux aarch64, macOS x86_64, macOS arm64.
  # Each matrix leg uploads its binary directly to the GitHub release.
  build-binaries:
    needs: prepare
    if: needs.prepare.outputs.has_binary == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            suffix: x86_64-linux
            cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            suffix: aarch64-linux
            cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            suffix: x86_64-macos
            cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: aarch64-macos
            cross: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-always: "true"

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get install -y musl-tools

      - name: Install cross
        if: matrix.cross == true
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build
        env:
          BINARY: ${{ needs.prepare.outputs.binary }}
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} --bin "$BINARY"
          else
            cargo build --release --target ${{ matrix.target }} --bin "$BINARY"
          fi
          cp "target/${{ matrix.target }}/release/${BINARY}" "${BINARY}-${{ matrix.suffix }}"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ needs.prepare.outputs.binary }}-${{ matrix.suffix }}

  # Build a multi-arch Docker image and push to ghcr.io for tau server releases.
  # Uses registry-backed layer cache so incremental builds are fast.
  docker:
    needs: prepare
    if: needs.prepare.outputs.is_tau == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: container/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tau:${{ needs.prepare.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/tau:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/tau:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/tau:buildcache,mode=max

  # Append platform-specific curl install instructions to the release notes.
  install-instructions:
    needs: [prepare, build-binaries]
    if: needs.prepare.outputs.has_binary == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Append install instructions
        env:
          BINARY: ${{ needs.prepare.outputs.binary }}
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          BASE="https://github.com/${REPO}/releases/download/${TAG}"

          gh release view "$TAG" --repo "$REPO" --json body -q .body > /tmp/notes.md

          printf '\n---\n\n## Install\n\n' >> /tmp/notes.md

          printf '**Linux x86_64**\n```bash\ncurl -fsSL %s/%s-x86_64-linux -o %s\nchmod +x %s && sudo mv %s /usr/local/bin/\n```\n\n' \
            "$BASE" "$BINARY" "$BINARY" "$BINARY" "$BINARY" >> /tmp/notes.md

          printf '**Linux aarch64**\n```bash\ncurl -fsSL %s/%s-aarch64-linux -o %s\nchmod +x %s && sudo mv %s /usr/local/bin/\n```\n\n' \
            "$BASE" "$BINARY" "$BINARY" "$BINARY" "$BINARY" >> /tmp/notes.md

          printf '**macOS x86_64**\n```bash\ncurl -fsSL %s/%s-x86_64-macos -o %s\nchmod +x %s && sudo mv %s /usr/local/bin/\n```\n\n' \
            "$BASE" "$BINARY" "$BINARY" "$BINARY" "$BINARY" >> /tmp/notes.md

          printf '**macOS aarch64 (Apple Silicon)**\n```bash\ncurl -fsSL %s/%s-aarch64-macos -o %s\nchmod +x %s && sudo mv %s /usr/local/bin/\n```\n' \
            "$BASE" "$BINARY" "$BINARY" "$BINARY" "$BINARY" >> /tmp/notes.md

          gh release edit "$TAG" --repo "$REPO" --notes-file /tmp/notes.md
