[package]
name = "bench"
version = "0.0.0" # x-release-please-version
edition.workspace = true
license.workspace = true
description = "Tau benchmark workloads and runner (uses libtau + tau)"
publish = false

[lib]
name = "bench"
path = "src/lib.rs"

[[bin]]
name = "benchtau"
path = "src/main.rs"

[[bench]]
name = "engine"
harness = false

[[bench]]
name = "wire"
harness = false

[dependencies]
libtau = { workspace = true }
tau = { path = "../tau" }
clap = { workspace = true }
rand = { workspace = true }
rustls = { workspace = true }
tempfile = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
divan = { workspace = true }
